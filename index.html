<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween CSS</title>
    <link rel="stylesheet" href="haunted-harvest.css">
</head>
<body>

    <main class="scenes">
        <section class="scene beach-scene" id="beach">

            <span class="seagull seagull-one">🕊️</span>
            <span class="seagull seagull-two">🕊️</span>
            <span class="seagull seagull-three">🕊️</span>

            <a href="#beach" class="pirate-ship pirate-left" aria-label="Pirate ship on the left">
                <span class="ship-body">⛵</span>
                <span class="ship-flag">🏴‍☠️</span>
            </a>

            <a href="#beach" class="pirate-ship pirate-right" aria-label="Pirate ship on the right">
                <span class="ship-body">⛵</span>
                <span class="ship-flag">🏴‍☠️</span>
            </a>

            <span class="cannonball cannonball-left"></span>
            <span class="cannonball cannonball-right"></span>

            <span class="cannon-impact impact-left">💥</span>
            <span class="cannon-impact impact-right">💥</span>

            <div class="ocean">
                <span class="wave wave-1">🌊</span>
                <span class="wave wave-2">🌊</span>
                <span class="wave wave-3">🌊</span>
                <span class="wave wave-4">🌊</span>
                <span class="wave wave-5">🌊</span>
                <span class="wave wave-6">🌊</span>
            </div>

        </section>
    </main>

</body>
</html>
